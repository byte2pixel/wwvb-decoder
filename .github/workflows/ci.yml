name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# verify.ps1 runs these same steps locally; change both together.
# Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.

jobs:
  host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: host/**/packages.lock.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build host/WwvbDecoder.slnx -c Release -p:BuildUi=false
      - run: dotnet test host/WwvbDecoder.slnx -c Release --no-build -p:BuildUi=false

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo build --release
      - run: cargo clippy --release -- -D warnings
