name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# verify.ps1 runs these same steps locally; change both together.
# Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.

jobs:
  host:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # test-reporter publishes a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: host/**/packages.lock.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build host/WwvbDecoder.slnx -c Release -p:BuildUi=false
      - run: dotnet test host/WwvbDecoder.slnx -c Release --no-build -p:BuildUi=false --coverage --coverage-output-format cobertura --report-xunit-trx --results-directory ${{ github.workspace }}/host/TestResults
      # Merges the per-project reports and fails below the thresholds, locally and here.
      - run: dotnet reportgenerator "-reports:host/TestResults/*.cobertura.xml" "-targetdir:coverage/host" "-reporttypes:MarkdownSummaryGithub;Cobertura;TextSummary" "minimumCoverageThresholds:lineCoverage=90" "minimumCoverageThresholds:branchCoverage=88"
      - if: ${{ !cancelled() }}
        run: Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content -Raw coverage/host/SummaryGithub.md)
      - if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: host tests
          use-actions-summary: false # a check run on the PR, not the job summary
          path: host/TestResults/*.trx
          reporter: dotnet-trx
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-coverage
          path: |
            coverage/host
            host/TestResults

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # test-reporter publishes a check run
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test # vitest with coverage; thresholds are in vite.config.ts
      - run: npm run build
      - if: ${{ !cancelled() }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: ui tests
          use-actions-summary: false # a check run on the PR, not the job summary
          path: ui/test-results/junit.xml
          reporter: java-junit
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-coverage
          path: |
            ui/coverage/lcov.info
            ui/coverage/cobertura-coverage.xml
            ui/test-results

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo build --release
      - run: cargo clippy --release -- -D warnings

  sonarcloud:
    # Uploads analysis, coverage, and test results to SonarQube Cloud. Not a required check.
    # Needs the SONAR_TOKEN secret, so it skips pull requests from forks. Automatic Analysis
    # must be off in the SonarQube Cloud project, or the two analyses conflict.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so new code is attributed correctly
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: host/**/packages.lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: dotnet tool restore
      - run: npm ci
        working-directory: ui
      - run: npm test # ui coverage as lcov
        working-directory: ui
      - run: >-
          dotnet sonarscanner begin /k:"byte2pixel_wwvb-decoder" /o:"byte2pixel" /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.projectBaseDir="${{ github.workspace }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="host/TestResults/*.xml"
          /d:sonar.cs.vstest.reportsPaths="host/TestResults/*.trx"
          /d:sonar.javascript.lcov.reportPaths="ui/coverage/lcov.info"
          /d:sonar.test.inclusions="ui/src/**/*.test.ts,ui/src/**/*.test.tsx"
          /d:sonar.exclusions="**/node_modules/**,ui/dist/**,ui/coverage/**,ui/test-results/**,coverage/**,**/TestResults/**,firmware/target/**,**/bin/**,**/obj/**"
      - run: dotnet build host/WwvbDecoder.slnx -c Release -p:BuildUi=false --no-incremental --disable-build-servers
      - run: dotnet test host/WwvbDecoder.slnx -c Release --no-build -p:BuildUi=false --coverage --coverage-output-format xml --report-xunit-trx --results-directory ${{ github.workspace }}/host/TestResults
      - run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
