name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# verify.ps1 runs these same steps locally; change both together.

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: host/**/packages.lock.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build host/WwvbDecoder.slnx -c Release -p:BuildUi=false
      - run: dotnet test host/WwvbDecoder.slnx -c Release --no-build -p:BuildUi=false

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo build --release
      - run: cargo clippy --release -- -D warnings
